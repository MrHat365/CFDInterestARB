name: Quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py mt5_trader tests
      - run: python -m mypy app.py mt5_trader
      - run: python -m pytest tests --ignore=tests/test_chart_ui.py -q
      - run: python -m pytest tests/test_chart_ui.py -q
